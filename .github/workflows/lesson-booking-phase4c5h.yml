name: Lesson booking Phase 4C5H

on:
  push:
    branches:
      - agent/lesson-booking-blueprint
    paths:
      - "scripts/lesson-booking-full-preview-fixture-principals.mjs"
      - "scripts/lesson-booking-preview-fixture-principals.mjs"
      - "scripts/check-lesson-booking-full-preview-fixture-principals.mjs"
      - ".github/workflows/lesson-booking-phase4c5h.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "scripts/lesson-booking-full-preview-fixture-principals.mjs"
      - "scripts/lesson-booking-preview-fixture-principals.mjs"
      - "scripts/check-lesson-booking-full-preview-fixture-principals.mjs"
      - ".github/workflows/lesson-booking-phase4c5h.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  fixture-principal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify synthetic fixture principal lifecycle and signed-provider preparation
        run: node scripts/check-lesson-booking-full-preview-fixture-principals.mjs
      - name: Verify fixture principal write gate is closed in CI
        run: node scripts/lesson-booking-preview-fixture-principals.mjs
      - name: Build application
        run: npm run build
