name: Lesson booking foundation

on:
  push:
    branches:
      - agent/lesson-booking-blueprint
    paths:
      - "supabase/**"
      - "scripts/check-lesson-booking-foundation.mjs"
      - ".github/workflows/lesson-booking-foundation.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/check-lesson-booking-foundation.mjs"
      - ".github/workflows/lesson-booking-foundation.yml"

permissions:
  contents: read

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify booking foundation invariants
        run: node scripts/check-lesson-booking-foundation.mjs
