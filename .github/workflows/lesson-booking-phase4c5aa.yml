name: Lesson booking Phase 4C5AA

on:
  push:
    branches:
      - agent/lesson-booking-blueprint
    paths:
      - "scripts/check-lesson-booking-preview-requeue-delivery-intent-terminal.mjs"
      - "scripts/check-lesson-booking-preview-requeue-delivery-intent.mjs"
      - "supabase/migrations/20260921153000_lesson_booking_phase4c5z_requeue_delivery_intent.sql"
      - "supabase/migrations/20260921163000_lesson_booking_phase4c5aa_requeue_delivery_intent_terminal_evidence.sql"
      - "supabase/tests/lesson_booking_preview_launch_blocker_requeue_delivery_intent_scenarios.sql"
      - "supabase/tests/lesson_booking_preview_launch_blocker_requeue_delivery_intent_terminal_scenarios.sql"
      - ".github/workflows/lesson-booking-phase4c5aa.yml"
  pull_request:
    paths:
      - "scripts/check-lesson-booking-preview-requeue-delivery-intent-terminal.mjs"
      - "scripts/check-lesson-booking-preview-requeue-delivery-intent.mjs"
      - "supabase/migrations/20260921153000_lesson_booking_phase4c5z_requeue_delivery_intent.sql"
      - "supabase/migrations/20260921163000_lesson_booking_phase4c5aa_requeue_delivery_intent_terminal_evidence.sql"
      - "supabase/tests/lesson_booking_preview_launch_blocker_requeue_delivery_intent_scenarios.sql"
      - "supabase/tests/lesson_booking_preview_launch_blocker_requeue_delivery_intent_terminal_scenarios.sql"
      - ".github/workflows/lesson-booking-phase4c5aa.yml"

permissions:
  contents: read

jobs:
  requeue-delivery-intent-terminal-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify Phase 4C5AA terminal-evidence boundary
        run: node scripts/check-lesson-booking-preview-requeue-delivery-intent-terminal.mjs
      - name: Re-verify Phase 4C5Z delivery-intent boundary
        run: node scripts/check-lesson-booking-preview-requeue-delivery-intent.mjs
      - name: Start ephemeral PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres pg_isready
      - name: Verify Phase Z/AA SQL behavior
        run: |
          set -euo pipefail
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_minimal_supabase.sql
          for migration in supabase/migrations/*.sql; do echo "Applying ${migration}"; sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f "${migration}"; done
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_preview_launch_blocker_requeue_delivery_intent_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_preview_launch_blocker_requeue_delivery_intent_terminal_scenarios.sql
      - name: Build application
        run: npm run build
