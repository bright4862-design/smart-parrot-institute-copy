name: Lesson booking foundation

on:
  push:
    branches:
      - agent/lesson-booking-blueprint
    paths:
      - "supabase/**"
      - "src/App.jsx"
      - "src/components/lesson/BookingRetentionControls.jsx"
      - "src/lib/LessonBookingAuthContext.jsx"
      - "src/lib/lessonBookingApi.js"
      - "src/lib/lessonBookingSupabase.js"
      - "src/pages/LessonBooking.jsx"
      - "src/pages/MyLessons.jsx"
      - "src/pages/LessonBookingPolicy.jsx"
      - "src/pages/LessonBookingAdmin.jsx"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-lesson-booking-foundation.mjs"
      - "scripts/check-lesson-booking-browser-boundary.mjs"
      - "scripts/check-lesson-booking-reservation-boundary.mjs"
      - "scripts/check-lesson-booking-stripe-boundary.mjs"
      - "scripts/check-lesson-booking-hold-recovery-boundary.mjs"
      - "scripts/check-lesson-booking-attendance-boundary.mjs"
      - "scripts/check-lesson-booking-settlement-boundary.mjs"
      - "scripts/check-lesson-booking-cancellation-boundary.mjs"
      - "scripts/check-lesson-booking-compliance-ux-boundary.mjs"
      - "scripts/check-lesson-booking-admin-ops-boundary.mjs"
      - "scripts/check-lesson-booking-admin-dispute-boundary.mjs"
      - "scripts/check-lesson-booking-preview-readiness-boundary.mjs"
      - "scripts/check-lesson-booking-retention-ops-boundary.mjs"
      - "scripts/check-lesson-booking-provider-staging-boundary.mjs"
      - "scripts/check-lesson-booking-launch-rehearsal-boundary.mjs"
      - "scripts/check-lesson-booking-rehearsal-readiness-boundary.mjs"
      - "scripts/lesson-booking-preview-e2e.mjs"
      - "scripts/lesson-booking-provider-preview-e2e.mjs"
      - ".github/workflows/lesson-booking-foundation.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "src/App.jsx"
      - "src/components/lesson/BookingRetentionControls.jsx"
      - "src/lib/LessonBookingAuthContext.jsx"
      - "src/lib/lessonBookingApi.js"
      - "src/lib/lessonBookingSupabase.js"
      - "src/pages/LessonBooking.jsx"
      - "src/pages/MyLessons.jsx"
      - "src/pages/LessonBookingPolicy.jsx"
      - "src/pages/LessonBookingAdmin.jsx"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-lesson-booking-foundation.mjs"
      - "scripts/check-lesson-booking-browser-boundary.mjs"
      - "scripts/check-lesson-booking-reservation-boundary.mjs"
      - "scripts/check-lesson-booking-stripe-boundary.mjs"
      - "scripts/check-lesson-booking-hold-recovery-boundary.mjs"
      - "scripts/check-lesson-booking-attendance-boundary.mjs"
      - "scripts/check-lesson-booking-settlement-boundary.mjs"
      - "scripts/check-lesson-booking-cancellation-boundary.mjs"
      - "scripts/check-lesson-booking-compliance-ux-boundary.mjs"
      - "scripts/check-lesson-booking-admin-ops-boundary.mjs"
      - "scripts/check-lesson-booking-admin-dispute-boundary.mjs"
      - "scripts/check-lesson-booking-preview-readiness-boundary.mjs"
      - "scripts/check-lesson-booking-retention-ops-boundary.mjs"
      - "scripts/check-lesson-booking-provider-staging-boundary.mjs"
      - "scripts/check-lesson-booking-launch-rehearsal-boundary.mjs"
      - "scripts/check-lesson-booking-rehearsal-readiness-boundary.mjs"
      - "scripts/lesson-booking-preview-e2e.mjs"
      - "scripts/lesson-booking-provider-preview-e2e.mjs"
      - ".github/workflows/lesson-booking-foundation.yml"
permissions:
  contents: read
jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm install
      - name: Start ephemeral PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres pg_isready
      - name: Typecheck Phase 2/3/4 Edge Functions
        run: >-
          deno check --node-modules-dir=none
          supabase/functions/create-video-token/index.ts
          supabase/functions/daily-webhook/index.ts
          supabase/functions/check-in/index.ts
          supabase/functions/settle-lessons/index.ts
          supabase/functions/cancel-booking/index.ts
          supabase/functions/stripe-dispute-webhook/index.ts
          supabase/functions/booking-preview-readiness/index.ts
          supabase/functions/booking-provider-preview-readiness/index.ts
      - name: Verify database foundation invariants
        run: node scripts/check-lesson-booking-foundation.mjs
      - name: Verify browser/auth boundary
        run: node scripts/check-lesson-booking-browser-boundary.mjs
      - name: Verify reservation/consent boundary
        run: node scripts/check-lesson-booking-reservation-boundary.mjs
      - name: Verify Stripe Checkout/webhook boundary
        run: node scripts/check-lesson-booking-stripe-boundary.mjs
      - name: Verify deferred hold/recovery boundary
        run: node scripts/check-lesson-booking-hold-recovery-boundary.mjs
      - name: Verify attendance/lesson-access boundary
        run: node scripts/check-lesson-booking-attendance-boundary.mjs
      - name: Verify settlement boundary
        run: node scripts/check-lesson-booking-settlement-boundary.mjs
      - name: Verify cancellation/compliance boundary
        run: node scripts/check-lesson-booking-cancellation-boundary.mjs
      - name: Verify Phase 3B compliance/UX boundary
        run: node scripts/check-lesson-booking-compliance-ux-boundary.mjs
      - name: Verify Phase 4A admin operations boundary
        run: node scripts/check-lesson-booking-admin-ops-boundary.mjs
      - name: Verify Phase 4B admin/dispute boundary
        run: node scripts/check-lesson-booking-admin-dispute-boundary.mjs
      - name: Verify Phase 4C2 preview/retention boundary
        run: node scripts/check-lesson-booking-preview-readiness-boundary.mjs
      - name: Verify Phase 4C3 retention ops/preview identity boundary
        run: node scripts/check-lesson-booking-retention-ops-boundary.mjs
      - name: Verify Phase 4C4 provider staging/retention approval boundary
        run: node scripts/check-lesson-booking-provider-staging-boundary.mjs
      - name: Verify Phase 4C5A rehearsal evidence/operator approval boundary
        run: node scripts/check-lesson-booking-launch-rehearsal-boundary.mjs
      - name: Verify Phase 4C5B1 rehearsal readiness/history boundary
        run: node scripts/check-lesson-booking-rehearsal-readiness-boundary.mjs
      - name: Verify preview E2E execution gate is closed in CI
        run: node scripts/lesson-booking-preview-e2e.mjs
      - name: Verify provider-write preview E2E gate is closed in CI
        run: node scripts/lesson-booking-provider-preview-e2e.mjs
      - name: Execute migrations + booking behavior scenarios
        run: |
          set -euo pipefail
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_minimal_supabase.sql
          for migration in supabase/migrations/*.sql; do echo "Applying ${migration}"; sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f "${migration}"; done
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_settlement_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_cancellation_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_compliance_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_admin_ops_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_admin_dispute_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_launch_hardening_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_preview_retention_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_retention_ops_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_retention_approval_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_provider_rehearsal_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_provider_rehearsal_readiness_scenarios.sql
      - name: Build application
        run: npm run build
