name: Lesson booking Phase 4C5O

on:
  push:
    branches:
      - agent/lesson-booking-blueprint
    paths:
      - "scripts/lesson-booking-full-preview-cleanup-attestation.mjs"
      - "scripts/check-lesson-booking-full-preview-cleanup-attestation.mjs"
      - "scripts/lesson-booking-full-preview-cleanup-lifecycle.mjs"
      - "scripts/check-lesson-booking-full-preview-cleanup-lifecycle.mjs"
      - "scripts/lesson-booking-full-preview-supabase-transport.mjs"
      - "supabase/migrations/20260921054000_lesson_booking_phase4c5o_cleanup_execution_attestation_inventory.sql"
      - "supabase/tests/lesson_booking_full_preview_cleanup_execution_attestation_scenarios.sql"
      - "supabase/tests/lesson_booking_full_preview_cleanup_plan_lifecycle_manifest_scenarios.sql"
      - ".github/workflows/lesson-booking-phase4c5o.yml"
  pull_request:
    paths:
      - "scripts/lesson-booking-full-preview-cleanup-attestation.mjs"
      - "scripts/check-lesson-booking-full-preview-cleanup-attestation.mjs"
      - "scripts/lesson-booking-full-preview-cleanup-lifecycle.mjs"
      - "scripts/check-lesson-booking-full-preview-cleanup-lifecycle.mjs"
      - "scripts/lesson-booking-full-preview-supabase-transport.mjs"
      - "supabase/migrations/20260921054000_lesson_booking_phase4c5o_cleanup_execution_attestation_inventory.sql"
      - "supabase/tests/lesson_booking_full_preview_cleanup_execution_attestation_scenarios.sql"
      - "supabase/tests/lesson_booking_full_preview_cleanup_plan_lifecycle_manifest_scenarios.sql"
      - ".github/workflows/lesson-booking-phase4c5o.yml"

permissions:
  contents: read

jobs:
  cleanup-execution-attestation-impact-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify Phase 4C5O service-only attestation boundary
        run: node scripts/check-lesson-booking-full-preview-cleanup-attestation.mjs
      - name: Re-verify Phase 4C5N cleanup lifecycle boundary
        run: node scripts/check-lesson-booking-full-preview-cleanup-lifecycle.mjs
      - name: Start ephemeral PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres pg_isready
      - name: Verify Phase 4C5O SQL behavior
        run: |
          set -euo pipefail
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_minimal_supabase.sql
          for migration in supabase/migrations/*.sql; do echo "Applying ${migration}"; sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f "${migration}"; done
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_full_preview_cleanup_plan_lifecycle_manifest_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_full_preview_cleanup_execution_attestation_scenarios.sql
      - name: Build application
        run: npm run build
