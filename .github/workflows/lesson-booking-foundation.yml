name: Lesson booking foundation

on:
  push:
    branches:
      - agent/lesson-booking-blueprint
    paths:
      - "supabase/**"
      - "src/App.jsx"
      - "src/lib/LessonBookingAuthContext.jsx"
      - "src/lib/lessonBookingApi.js"
      - "src/lib/lessonBookingSupabase.js"
      - "src/pages/LessonBooking.jsx"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-lesson-booking-foundation.mjs"
      - "scripts/check-lesson-booking-browser-boundary.mjs"
      - ".github/workflows/lesson-booking-foundation.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "src/App.jsx"
      - "src/lib/LessonBookingAuthContext.jsx"
      - "src/lib/lessonBookingApi.js"
      - "src/lib/lessonBookingSupabase.js"
      - "src/pages/LessonBooking.jsx"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-lesson-booking-foundation.mjs"
      - "scripts/check-lesson-booking-browser-boundary.mjs"
      - ".github/workflows/lesson-booking-foundation.yml"

permissions:
  contents: write

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Persist resolved lockfile on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync lesson booking dependency lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify database foundation invariants
        run: node scripts/check-lesson-booking-foundation.mjs
      - name: Verify browser/auth boundary
        run: node scripts/check-lesson-booking-browser-boundary.mjs
      - name: Build application
        run: npm run build
