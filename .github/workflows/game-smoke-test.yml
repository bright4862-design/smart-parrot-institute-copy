name: Game Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx -y playwright@1.54.1 install --with-deps chromium
      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/smart-parrot-vite.log 2>&1 &
          npx -y wait-on@8.0.1 http://127.0.0.1:5173
      - name: Run smoke test
        run: |
          cat > /tmp/smoke.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          test('Heathrow playable spine boots and responds', async ({ page }) => {
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(err.message));

            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto('http://127.0.0.1:5173/LondonMission', { waitUntil: 'networkidle' });
            await expect(page.locator('canvas')).toBeVisible();
            await expect(page.getByText(/Heathrow|London/i).first()).toBeVisible();
            await page.screenshot({ path: 'smoke-desktop.png', fullPage: true });

            await page.keyboard.down('KeyW');
            await page.waitForTimeout(800);
            await page.keyboard.up('KeyW');
            await page.keyboard.press('KeyE');
            await page.waitForTimeout(300);

            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'networkidle' });
            await expect(page.locator('canvas')).toBeVisible();
            await page.screenshot({ path: 'smoke-mobile.png', fullPage: true });

            expect(errors, `Browser errors: ${errors.join('\n')}`).toEqual([]);
          });
          EOF
          npx -y playwright@1.54.1 test /tmp/smoke.spec.js --reporter=line
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-smoke-evidence
          path: |
            smoke-desktop.png
            smoke-mobile.png
            playwright-report/
            test-results/
          if-no-files-found: ignore
