name: Lesson booking Phase 4C5M

on:
  push:
    branches:
      - agent/lesson-booking-blueprint
    paths:
      - "scripts/lesson-booking-full-preview-cleanup-review.mjs"
      - "scripts/check-lesson-booking-full-preview-cleanup-review.mjs"
      - "scripts/lesson-booking-full-preview-supabase-transport.mjs"
      - "supabase/migrations/20260921033000_lesson_booking_phase4c5m_cleanup_review_plan.sql"
      - "supabase/tests/lesson_booking_full_preview_cleanup_review_plan_scenarios.sql"
      - "supabase/tests/lesson_booking_full_preview_reconciliation_resolution_retention_review_scenarios.sql"
      - ".github/workflows/lesson-booking-phase4c5m.yml"
  pull_request:
    paths:
      - "scripts/lesson-booking-full-preview-cleanup-review.mjs"
      - "scripts/check-lesson-booking-full-preview-cleanup-review.mjs"
      - "scripts/lesson-booking-full-preview-supabase-transport.mjs"
      - "supabase/migrations/20260921033000_lesson_booking_phase4c5m_cleanup_review_plan.sql"
      - "supabase/tests/lesson_booking_full_preview_cleanup_review_plan_scenarios.sql"
      - "supabase/tests/lesson_booking_full_preview_reconciliation_resolution_retention_review_scenarios.sql"
      - ".github/workflows/lesson-booking-phase4c5m.yml"

permissions:
  contents: read

jobs:
  cleanup-review-dry-run-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify Phase 4C5M cleanup-review dry-run boundary
        run: node scripts/check-lesson-booking-full-preview-cleanup-review.mjs
      - name: Re-verify Phase 4C5L trusted reconciliation and retention-review boundary
        run: node scripts/check-lesson-booking-full-preview-reconciliation-resolution.mjs
      - name: Start ephemeral PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres pg_isready
      - name: Verify Phase 4C5M SQL behavior
        run: |
          set -euo pipefail
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_minimal_supabase.sql
          for migration in supabase/migrations/*.sql; do echo "Applying ${migration}"; sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f "${migration}"; done
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_full_preview_reconciliation_resolution_retention_review_scenarios.sql
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/lesson_booking_full_preview_cleanup_review_plan_scenarios.sql
      - name: Build application
        run: npm run build
