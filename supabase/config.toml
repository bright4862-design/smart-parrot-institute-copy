# Smart Parrot Institute Supabase function security settings.
# Authenticated browser functions keep platform JWT verification enabled.

[functions.create-booking]
verify_jwt = true

[functions.fix-payment]
verify_jwt = true

[functions.cancel-booking]
verify_jwt = true

[functions.create-video-token]
verify_jwt = true

[functions.check-in]
verify_jwt = true

# Admin-only configuration/readiness probe. The handler re-checks profiles.role
# and returns status/boolean metadata only; it never returns secret values.
[functions.booking-preview-readiness]
verify_jwt = true

# Separate admin-only provider identity probe for explicitly gated preview E2E.
# It performs read-only provider identity checks and returns status metadata only.
[functions.booking-provider-preview-readiness]
verify_jwt = true

# Stripe is an external provider: it authenticates with Stripe-Signature, not a
# Supabase Authorization header. The handler verifies the raw body signature.
[functions.stripe-webhook]
verify_jwt = false

# Separate test-only dispute endpoint and signing secret. It records minimized
# review evidence only and contains no Stripe dispute write primitive.
[functions.stripe-dispute-webhook]
verify_jwt = false

# Daily is an external provider: it authenticates with the configured webhook
# HMAC. The handler verifies the raw request before parsing or writing evidence.
[functions.daily-webhook]
verify_jwt = false

# Cron/service-to-service calls send a Supabase secret key in the apikey header.
# withSupabase({ auth: 'secret' }) performs the application-level check.
[functions.place-holds]
verify_jwt = false

[functions.settle-lessons]
verify_jwt = false
